<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Экопункт — расчёт пользы</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div class="container">
            <h1>Расчёт пользы</h1>
            <p>Учебная версия 1</p>

            <nav>
                <a href="index.html">Главная</a>
                <a href="catalog.html">Каталог отходов</a>
                <a href="form.html">Расчёт пользы</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="form-section">
            <h2>Рассчитай свой вклад</h2>
            <p>
                Укажи вид отходов и количество сданных килограммов.
            </p>

            <form id="ecoForm">
                <label for="wasteType">Вид отходов</label>

                <select id="wasteType" required>
        <option value="">Выберите вид отходов</option>
        <option value="plastic">Пластик</option>
        <option value="paper">Бумага и картон</option>
        <option value="glass">Стекло</option>
        <option value="metal">Металл</option>
        <option value="textile">Текстиль</option>
      </select>

                <label for="weight">Количество, кг</label>

                <input type="number" id="weight" min="0.1" step="0.1" placeholder="Например, 5" required>

                <button class="button" type="submit">
        Рассчитать
      </button>
            </form>

            <div id="calculationResult" class="calculation-result"></div>
        </section>
    </main>

    <footer>
        <p>© 2026 Экопункт</p>
    </footer>

    <script src="app.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("./sw.js")
                .then(() => console.log("Service Worker запущен"))
                .catch((error) => console.error("Ошибка Service Worker:", error));
        }
    </script>

</body>

</html>
