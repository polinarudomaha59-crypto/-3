<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Каталог</title>
    <!-- Если у вас были стили (style.css), убедитесь, что они подключены здесь -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <nav>
            <a href="index.html">Главная</a> |
            <a href="catalog.html">Каталог</a> |
            <a href="form.html">Форма</a>
        </nav>
    </header>

    <main>
        <h1>Каталог товаров</h1>

        <!-- Поле поиска -->
        <p>
            <label for="search">Поиск по названию</label>
            <input id="search" type="search" placeholder="Введите часть названия">
        </p>

        <!-- Сюда скрипт будет выводить карточки -->
        <div id="catalog-list" class="products"></div>

        <!-- Сюда скрипт будет выводить счетчик -->
        <p id="status" role="status"></p>
    </main>

    <!-- Подключаем наш скрипт -->
    <script src="catalog-page.js" defer></script>
</body>

</html>
